# Прод-стек NailGo: сайт (Caddy + статика), API (Fastify) и Postgres.
#
# Запуск:
#   cp .env.production.example .env   # заполнить секреты
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#
# Состав соответствует тому, что реально есть в репозитории: сайт, API и база.
# Redis, отдельная админка и воркер появятся вместе с кодом, который их требует.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_UPSTREAM: ${API_UPSTREAM:-api:4000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-4000}
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      # Код подтверждения: log — в лог сервера (пока не подключён SMS-провайдер),
      # sms — ответит 503, пока провайдер не реализован.
      DEV_OTP_ENABLED: ${DEV_OTP_ENABLED:-false}
      OTP_DELIVERY: ${OTP_DELIVERY:-log}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      SLOT_STEP_MINUTES: ${SLOT_STEP_MINUTES:-30}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      TZ: ${TZ:-Europe/Moscow}
    expose:
      - "${API_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
